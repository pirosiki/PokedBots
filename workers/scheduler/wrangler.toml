name = "pokedbots-scheduler"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[triggers]
crons = [
  "*/15 * * * *",            # auto-scavenge-v2 every 15 min
  "0 4,10,16,22 * * *"       # auto-event-registration 2 hours before race
]

# New team system crons (disabled):
#   "*/15 * * * *"           - Team Daily Maintenance
#   "50 5,11,17,23 * * *"    - Team Daily Pre-Race

[vars]
GITHUB_OWNER = "pirosiki"
GITHUB_REPO = "PokedBots"

# Secrets (set with: wrangler secret put GITHUB_TOKEN)
# GITHUB_TOKEN = "ghp_..."
